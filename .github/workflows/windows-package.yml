name: Windows package and release

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Release publication has external side effects. Serialize it without cancelling
# an already running release so each candidate checks the complete prior history.
concurrency:
  group: minecraft-server-studio-windows-release
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

# Dependency inventory: Windows is supplied by the runner; setup-node provides
# Node.js and npm; package-lock.json fixes the restored dependency graph.
# This workflow deliberately packages only. It does not run tests, linting,
# type checks, accessibility checks, reviews, or capture work.
jobs:
  package-and-release:
    name: Build and release unsigned Squirrel package
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      CSC_LINK: ""
      CSC_KEY_PASSWORD: ""
      CSC_NAME: ""
      WIN_CSC_LINK: ""
      WIN_CSC_KEY_PASSWORD: ""
    steps:
      - name: Check out source and history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record workflow start time
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          $startedAt = & gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" --jq '.run_started_at'
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($startedAt)) {
            throw 'Unable to obtain the workflow start timestamp from GitHub Actions.'
          }
          Add-Content -Path $env:GITHUB_ENV -Value "WORKFLOW_STARTED_AT=$startedAt"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Restore declared dependencies
        run: npm ci

      - name: Derive immutable Squirrel application version
        shell: pwsh
        run: |
          $runNumber = [string]$env:GITHUB_RUN_NUMBER
          $runAttempt = [string]$env:GITHUB_RUN_ATTEMPT
          if ($runNumber -notmatch '^[1-9]\d*$' -or $runAttempt -notmatch '^[1-9]\d*$') {
            throw "GitHub Actions did not provide positive numeric run metadata (run=$runNumber, attempt=$runAttempt)."
          }

          $sourceVersion = & node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version"
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($sourceVersion) -or $sourceVersion -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw "package.json must contain a strict three-part source version before release packaging; received '$sourceVersion'."
          }

          $squirrelVersion = "0.$runNumber.$runAttempt"
          if ($squirrelVersion -notmatch '^0\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw "The computed Squirrel version is not strict stable SemVer: $squirrelVersion"
          }

          $releaseTag = "v$sourceVersion-build.$runNumber.$runAttempt"
          Add-Content -Path $env:GITHUB_ENV -Value "SQUIRREL_VERSION=$squirrelVersion"
          Add-Content -Path $env:GITHUB_ENV -Value "RELEASE_TAG=$releaseTag"

      - name: Build unsigned Squirrel.Windows package
        shell: pwsh
        run: npm run package -- "-c.extraMetadata.version=$env:SQUIRREL_VERSION"

      - name: Validate unsigned Squirrel artifacts
        shell: pwsh
        run: |
          $squirrelOutput = Join-Path $env:GITHUB_WORKSPACE 'dist\squirrel-windows'
          if (-not (Test-Path -LiteralPath $squirrelOutput -PathType Container)) {
            throw "Squirrel output directory was not created: $squirrelOutput"
          }
          if ([string]::IsNullOrWhiteSpace($env:SQUIRREL_VERSION) -or $env:SQUIRREL_VERSION -notmatch '^0\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw "The workflow has no valid injected Squirrel version: '$env:SQUIRREL_VERSION'."
          }

          $expectedSetupName = "Minecraft.Server.Studio-$env:SQUIRREL_VERSION-x64-Setup.exe"
          $expectedFullPackageName = "minecraft-server-studio-$env:SQUIRREL_VERSION-full.nupkg"

          $setupFiles = @(Get-ChildItem -LiteralPath $squirrelOutput -File -Filter '*Setup.exe')
          if ($setupFiles.Count -ne 1) {
            throw "Expected exactly one Setup.exe artifact, found $($setupFiles.Count)."
          }
          $setupFile = $setupFiles[0]
          if (-not [string]::Equals($setupFile.Name, $expectedSetupName, [StringComparison]::Ordinal)) {
            throw "Setup executable $($setupFile.Name) does not match the injected application version artifact name $expectedSetupName."
          }

          $releasesFile = Join-Path $squirrelOutput 'RELEASES'
          if (-not (Test-Path -LiteralPath $releasesFile -PathType Leaf)) {
            throw "Squirrel RELEASES file is missing: $releasesFile"
          }

          $fullPackages = @(Get-ChildItem -LiteralPath $squirrelOutput -File -Filter '*-full.nupkg')
          if ($fullPackages.Count -ne 1) {
            throw "Expected exactly one Squirrel full package, found $($fullPackages.Count)."
          }
          $fullPackage = $fullPackages[0]
          if (-not [string]::Equals($fullPackage.Name, $expectedFullPackageName, [StringComparison]::Ordinal)) {
            throw "Full package $($fullPackage.Name) does not match the injected application version package name $expectedFullPackageName."
          }

          $releasesText = Get-Content -LiteralPath $releasesFile -Raw
          $releaseRows = @($releasesText -split "`r?`n" | ForEach-Object { $_.Trim() } | Where-Object { $_ })
          $expectedReleaseRowPattern = '^[a-f0-9]{40}\s+' + [regex]::Escape($expectedFullPackageName) + '\s+[1-9]\d*$'
          $expectedReleaseRows = @($releaseRows | Where-Object { $_ -match $expectedReleaseRowPattern })
          if ($expectedReleaseRows.Count -ne 1) {
            throw "RELEASES must contain exactly one valid row for $expectedFullPackageName; found $($expectedReleaseRows.Count)."
          }

          $signature = Get-AuthenticodeSignature -FilePath $setupFile.FullName
          if ($signature.Status -ne 'NotSigned') {
            throw "Setup executable must be unsigned; Get-AuthenticodeSignature reported $($signature.Status)."
          }

          $deltaPackages = @(Get-ChildItem -LiteralPath $squirrelOutput -File -Filter '*-delta.nupkg')
          $releaseAssets = @($setupFile.FullName, $releasesFile) +
            @($fullPackage.FullName) +
            @($deltaPackages | ForEach-Object { $_.FullName })
          $releaseAssets = @($releaseAssets | Select-Object -Unique)

          $evidenceRoot = Join-Path $env:RUNNER_TEMP 'windows-package-evidence'
          New-Item -ItemType Directory -Force -Path $evidenceRoot | Out-Null
          $hashRows = foreach ($assetPath in $releaseAssets) {
            $hash = Get-FileHash -LiteralPath $assetPath -Algorithm SHA256
            [pscustomobject]@{
              File = [IO.Path]::GetFileName($assetPath)
              SHA256 = $hash.Hash
              Bytes = (Get-Item -LiteralPath $assetPath).Length
            }
          }
          $hashRows = @($hashRows | Sort-Object File)
          $hashMarkdown = @(
            '| Artifact | SHA-256 | Bytes |',
            '| --- | --- | ---: |'
          )
          $hashMarkdown += $hashRows | ForEach-Object {
            "| $($_.File) | ``$($_.SHA256)`` | $($_.Bytes) |"
          }
          $hashFile = Join-Path $evidenceRoot 'artifact-hashes.md'
          $hashRowsFile = Join-Path $evidenceRoot 'artifact-hashes.json'
          Set-Content -LiteralPath $hashFile -Value ($hashMarkdown -join [Environment]::NewLine) -Encoding utf8
          $hashRows | ConvertTo-Json -Depth 3 | Set-Content -LiteralPath $hashRowsFile -Encoding utf8

          Add-Content -Path $env:GITHUB_ENV -Value "SQUIRREL_OUTPUT=$squirrelOutput"
          Add-Content -Path $env:GITHUB_ENV -Value "SETUP_PATH=$($setupFile.FullName)"
          Add-Content -Path $env:GITHUB_ENV -Value "SETUP_NAME=$($setupFile.Name)"
          Add-Content -Path $env:GITHUB_ENV -Value "FULL_PACKAGE_PATH=$($fullPackage.FullName)"
          Add-Content -Path $env:GITHUB_ENV -Value "FULL_PACKAGE_NAME=$($fullPackage.Name)"
          Add-Content -Path $env:GITHUB_ENV -Value "RELEASES_PATH=$releasesFile"
          Add-Content -Path $env:GITHUB_ENV -Value "ARTIFACT_HASHES_PATH=$hashFile"
          Add-Content -Path $env:GITHUB_ENV -Value "ARTIFACT_HASHES_JSON_PATH=$hashRowsFile"

      - name: Count source lines for the release record
        shell: pwsh
        run: |
          $lineCountPath = Join-Path $env:RUNNER_TEMP 'windows-package-evidence\line-count.md'
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $lineCountPath) | Out-Null
          $lineCount = & node scripts/line-count.cjs --format markdown
          if ($LASTEXITCODE -ne 0) {
            throw "The committed line-count script failed with exit code $LASTEXITCODE."
          }
          $lineCount | Set-Content -LiteralPath $lineCountPath -Encoding utf8
          Add-Content -Path $env:GITHUB_ENV -Value "LINE_COUNT_PATH=$lineCountPath"

      - name: Resolve optional dim sum release metadata
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          $metadataPath = Join-Path $env:RUNNER_TEMP 'windows-package-evidence\dim-sum-release-metadata.md'
          & pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/resolve-dim-sum-release-metadata.ps1 `
            -OutputPath $metadataPath `
            -CurrentReleaseTag $env:RELEASE_TAG `
            -ProductRepository $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $metadataPath -PathType Leaf)) {
            throw 'The dim-sum release-metadata resolver did not produce release-note metadata.'
          }

          Add-Content -Path $env:GITHUB_ENV -Value "DIM_SUM_RELEASE_NOTES_PATH=$metadataPath"

      - name: Create immutable non-draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:RELEASE_TAG
          if ([string]::IsNullOrWhiteSpace($tag)) {
            throw 'The release tag was not derived before publication.'
          }
          $releaseTitle = "Minecraft Server Studio $env:SQUIRREL_VERSION"
          $fullPackage = Get-Item -LiteralPath $env:FULL_PACKAGE_PATH -ErrorAction Stop
          if (-not [string]::Equals($fullPackage.Name, $env:FULL_PACKAGE_NAME, [StringComparison]::Ordinal)) {
            throw "The validated full package $($fullPackage.Name) does not match FULL_PACKAGE_NAME $env:FULL_PACKAGE_NAME."
          }
          $deltaPackages = @(Get-ChildItem -LiteralPath $env:SQUIRREL_OUTPUT -File -Filter '*-delta.nupkg')
          $assets = @($env:SETUP_PATH, $env:RELEASES_PATH) +
            @($fullPackage.FullName) +
            @($deltaPackages | ForEach-Object { $_.FullName })
          $assets = @($assets | Select-Object -Unique)
          $setupAssetName = [IO.Path]::GetFileName($env:SETUP_PATH)
          if ([string]::IsNullOrWhiteSpace($setupAssetName)) {
            throw 'The validated Setup.exe path does not contain a filename.'
          }
          if (-not [string]::Equals($setupAssetName, $env:SETUP_NAME, [StringComparison]::Ordinal)) {
            throw "The validated Setup.exe filename $setupAssetName does not match SETUP_NAME $env:SETUP_NAME."
          }

          $initialBodyPath = Join-Path $env:RUNNER_TEMP 'windows-package-evidence\release-body-initial.md'
          @(
            "# $releaseTitle",
            '',
            'Packaging completed on Windows with Squirrel.Windows. Detailed artifact hashes, timing, and line counts are being finalized by this workflow.'
          ) | Set-Content -LiteralPath $initialBodyPath -Encoding utf8

          $existingJson = & gh release view $tag --repo $env:GITHUB_REPOSITORY --json tagName,targetCommitish,isDraft,url 2>$null
          if ($LASTEXITCODE -eq 0) {
            $existing = $existingJson | ConvertFrom-Json
            throw "Release tag $tag already exists at $($existing.url); immutable Squirrel assets must not be replaced."
          } else {
            & gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title $releaseTitle --notes-file $initialBodyPath @assets
            if ($LASTEXITCODE -ne 0) {
              throw "Unable to create the non-draft release $tag."
            }
          }

          $releasePublicationRecordedAt = [DateTimeOffset]::UtcNow
          $startedAt = [DateTimeOffset]::Parse($env:WORKFLOW_STARTED_AT)
          $elapsedToReleasePublication = $releasePublicationRecordedAt - $startedAt
          $elapsedToReleasePublicationText = ('{0:00}:{1:00}:{2:00}' -f [math]::Floor($elapsedToReleasePublication.TotalHours), $elapsedToReleasePublication.Minutes, $elapsedToReleasePublication.Seconds)
          $hashMarkdown = Get-Content -LiteralPath $env:ARTIFACT_HASHES_PATH -Raw
          $lineCountMarkdown = Get-Content -LiteralPath $env:LINE_COUNT_PATH -Raw
          $dimSumReleaseMetadata = Get-Content -LiteralPath $env:DIM_SUM_RELEASE_NOTES_PATH -Raw
          $releaseBodyPath = Join-Path $env:RUNNER_TEMP 'windows-package-evidence\release-body.md'
          @(
            "# $releaseTitle",
            '',
            '> [!WARNING]',
            '> The attached Windows Squirrel installer and update packages are unsigned. Windows may show an unknown-publisher or SmartScreen warning.',
            '',
            '## Release-publication timing',
            "- Workflow started (UTC): $($startedAt.ToUniversalTime().ToString('o'))",
            "- Release publication command completed (UTC): $($releasePublicationRecordedAt.ToString('o'))",
            "- Elapsed through release publication: $elapsedToReleasePublicationText",
            '- Timing scope: this record ends when non-draft release creation succeeds. The final release-note edit, published-asset availability poll, evidence collection, and evidence upload occur later in the workflow; this note does not assert a terminal workflow-completion timestamp.',
            '',
            '## Validated artifacts',
            $hashMarkdown.TrimEnd(),
            '',
            "- Setup executable (exact generated Squirrel asset name): $setupAssetName",
            "- Full Squirrel package (exact generated update asset name): $($fullPackage.Name)",
            "- Squirrel/Electron application version: $env:SQUIRREL_VERSION",
            "- Release provenance tag: $tag",
            'The package validation confirmed exactly one version-matched Setup.exe, exactly one version-matched full Squirrel package, exactly one matching RELEASES row, and an unsigned Setup.exe status.',
            '',
            '## Source line count',
            'Generated by `node scripts/line-count.cjs --format markdown` at the release commit. The report includes its category table and explicit exclusions for generated dependency resolution data, dependencies, vendor trees, build output, and coverage output.',
            '',
            $lineCountMarkdown.TrimEnd(),
            '',
            '## Verification boundary',
            'This workflow restored dependencies, packaged the Windows artifact, validated the Squirrel output, calculated hashes, and recorded the line count. It did not run tests, linting, type checks, accessibility checks, reviews, or capture work.',
            '',
            $dimSumReleaseMetadata.TrimEnd()
          ) | Set-Content -LiteralPath $releaseBodyPath -Encoding utf8

          & gh release edit $tag --repo $env:GITHUB_REPOSITORY --title $releaseTitle --notes-file $releaseBodyPath
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to finalize the release notes for $tag."
          }
          $expectedLocalAssets = @($assets | ForEach-Object {
            $assetName = [IO.Path]::GetFileName($_)
            [pscustomobject]@{
              Path = $_
              Name = $assetName
            }
          })

          function Resolve-ExpectedReleaseAssets {
            param([Parameter(Mandatory)] $PublishedAssets)

            $publishedAssets = @($PublishedAssets | Where-Object { $null -ne $_ })
            $unresolved = [System.Collections.Generic.List[string]]::new()
            $resolved = [System.Collections.Generic.List[object]]::new()

            function Test-ReleaseAssetUrl {
              param([Parameter(Mandatory)][string] $Value)

              $uri = $null
              return [Uri]::TryCreate($Value, [UriKind]::Absolute, [ref]$uri) -and
                [string]::Equals($uri.Scheme, [Uri]::UriSchemeHttps, [StringComparison]::OrdinalIgnoreCase)
            }

            foreach ($expectedAsset in $expectedLocalAssets) {
              $exactMatches = @($publishedAssets | Where-Object {
                [string]::Equals([string]$_.name, $expectedAsset.Name, [StringComparison]::Ordinal)
              })
              if ($exactMatches.Count -ne 1) {
                $unresolved.Add("$($expectedAsset.Name) (expected exactly one exact-name match; found $($exactMatches.Count))")
              } else {
                $resolved.Add($exactMatches[0])
              }
            }

            foreach ($asset in $resolved) {
              if (([int64]$asset.size) -le 0) {
                $unresolved.Add("$($asset.name) (published size is $($asset.size))")
              }
              $releaseUrl = [string]$asset.url
              if ([string]::IsNullOrWhiteSpace($releaseUrl) -or -not (Test-ReleaseAssetUrl -Value $releaseUrl)) {
                $unresolved.Add("$($asset.name) (release URL is unavailable or invalid)")
              }
            }

            return [pscustomobject]@{
              Complete = $unresolved.Count -eq 0
              Resolved = @($resolved.ToArray())
              Unresolved = @($unresolved.ToArray())
            }
          }

          $assetPollIntervalSeconds = 5
          $assetPollStartedAt = [DateTimeOffset]::UtcNow
          $assetAvailabilityDeadline = $assetPollStartedAt.AddSeconds(90)
          $verified = $null
          $assetResolution = $null
          $lastUnresolvedAssets = @()
          do {
            $releaseJson = & gh release view $tag --repo $env:GITHUB_REPOSITORY --json tagName,targetCommitish,isDraft,url,assets 2>$null
            if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($releaseJson)) {
              $assetResolution = [pscustomobject]@{
                Complete = $false
                Unresolved = @("release metadata unavailable; expected assets: $($expectedLocalAssets.Name -join ', ')")
              }
            } else {
              $verified = $releaseJson | ConvertFrom-Json
              if ($verified.isDraft -or $verified.targetCommitish -ne $env:GITHUB_SHA) {
                throw "Release verification failed for $tag."
              }
              $assetResolution = Resolve-ExpectedReleaseAssets -PublishedAssets $verified.assets
            }
            $lastUnresolvedAssets = @($assetResolution.Unresolved)
            if ($assetResolution.Complete) {
              break
            }
            if ([DateTimeOffset]::UtcNow -ge $assetAvailabilityDeadline) {
              break
            }
            Start-Sleep -Seconds $assetPollIntervalSeconds
          } while ($true)
          if (-not $assetResolution.Complete) {
            $elapsedSeconds = [math]::Round(([DateTimeOffset]::UtcNow - $assetPollStartedAt).TotalSeconds)
            $unresolvedText = if ($lastUnresolvedAssets.Count -gt 0) { $lastUnresolvedAssets -join '; ' } else { 'no asset details were returned' }
            throw "Release $tag asset verification timed out after $elapsedSeconds seconds. Unresolved assets: $unresolvedText"
          }
          @(
            '## Windows package release',
            '',
            "- Release: $($verified.url)",
            "- Tag: $($verified.tagName)",
            "- Target commit: $($verified.targetCommitish)",
            "- Status: non-draft"
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8

      - name: Collect package evidence
        if: ${{ always() }}
        continue-on-error: true
        shell: pwsh
        run: |
          $evidenceRoot = Join-Path $env:RUNNER_TEMP 'windows-package-evidence'
          $artifactRoot = Join-Path $evidenceRoot 'squirrel-windows'
          New-Item -ItemType Directory -Force -Path $artifactRoot | Out-Null
          $metadata = [ordered]@{
            runId = $env:GITHUB_RUN_ID
            runAttempt = $env:GITHUB_RUN_ATTEMPT
            squirrelVersion = $env:SQUIRREL_VERSION
            releaseTag = $env:RELEASE_TAG
            commit = $env:GITHUB_SHA
            job = $env:GITHUB_JOB
            jobStatus = '${{ job.status }}'
            runnerOs = $env:RUNNER_OS
            runnerArchitecture = $env:RUNNER_ARCH
            node = (node --version)
            npm = (npm --version)
          }
          $metadata | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $evidenceRoot 'build-context.json') -Encoding utf8
          $squirrelOutput = $env:SQUIRREL_OUTPUT
          if ([string]::IsNullOrWhiteSpace($squirrelOutput)) {
            $squirrelOutput = Join-Path $env:GITHUB_WORKSPACE 'dist\squirrel-windows'
          }
          if (Test-Path -LiteralPath $squirrelOutput -PathType Container) {
            $squirrelItems = @(Get-ChildItem -LiteralPath $squirrelOutput -Force)
            if ($squirrelItems.Count -gt 0) {
              Copy-Item -LiteralPath $squirrelItems.FullName -Destination $artifactRoot -Recurse -Force
            }
          }

      - name: Upload package evidence
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: windows-squirrel-package-${{ github.run_id }}
          path: ${{ runner.temp }}/windows-package-evidence
          if-no-files-found: warn
          retention-days: 7
